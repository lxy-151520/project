[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pet-hospital-mcp"
version = "1.0.0"
description = "无状态 MCP 服务（SDK 2.x / 协议 2026-07-28），把 Go 宠物医院 REST API 暴露给 AI Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp==2.0.0",
    "httpx>=0.28,<1",
    "pydantic>=2.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
pet-hospital-mcp = "pet_hospital_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pet_hospital_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
